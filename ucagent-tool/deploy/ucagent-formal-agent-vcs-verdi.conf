# Optional systemd drop-in for the UCAgent formal-agent service.
#
# The referenced file is administrator-owned, mode 0600, and intentionally is
# not part of the repository.  It may define SNPSLMD_LICENSE_FILE and/or
# LM_LICENSE_FILE for a legitimately licensed Synopsys installation.
[Service]
EnvironmentFile=-/etc/ucagent/vcs-license.env
